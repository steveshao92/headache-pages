<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>头痛随记 — 隐私政策与支持</title>
<style>
  :root { --plum:#2B2544; --accent:#7A63B4; --ink:#1c1a24; --muted:#5c5870; }
  * { box-sizing:border-box; }
  body {
    margin:0; padding:0 20px 96px; min-height:100vh;
    font:16px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink); background:#fff;
    -webkit-text-size-adjust:100%;
  }
  main { max-width:640px; margin:0 auto; }
  header { padding:72px 0 24px; }
  h1 { font-size:30px; line-height:1.3; margin:0 0 14px; letter-spacing:-.01em; }
  .lede { color:var(--muted); font-size:17px; margin:0; }
  .cards { display:grid; gap:14px; margin:36px 0 0; }
  a.card {
    display:block; padding:20px 22px; border:1px solid #e8e6ee; border-radius:12px;
    text-decoration:none; color:inherit; transition:border-color .15s, background .15s;
  }
  a.card:hover { border-color:var(--accent); background:#faf9fd; }
  a.card strong { display:block; font-size:17px; margin-bottom:4px; }
  a.card span { color:var(--muted); font-size:14.5px; }
  footer {
    margin-top:56px; padding-top:20px; border-top:1px solid #e8e6ee;
    color:var(--muted); font-size:14px;
  }
  footer p { margin:0 0 8px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>

<header>
  <h1>头痛随记</h1>
  <p class="lede">发作时点一下就能记下的偏头痛记录工具。没有账号，没有服务器，记录只保存在你的 iPhone 上。</p>
</header>

<div class="cards">
  <a class="card" href="./privacy/">
    <strong>隐私政策</strong>
    <span>收集哪些数据、保存在哪里、如何删除与撤回授权</span>
  </a>
  <a class="card" href="./support/">
    <strong>支持与常见问题</strong>
    <span>上手指引、小组件设置、常见问题与联系方式</span>
  </a>
</div>

<footer>
  <p>如需帮助，请联系 <a href="mailto:freethinkersj@gmail.com">freethinkersj@gmail.com</a>。</p>
  <p>本工具不提供诊断、治疗或用药建议，分析结论不能替代医生的判断。</p>
</footer>

</main>
</body>
</html>
